<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethan Hook</title>
  </head>
  <body>
    <site-header active="home"></site-header>

    <main>
      <section class="hero" id="top">
        <div class="container">
          <div class="row">
            <div class="col-lg-8 hero-content">
              <p class="hero-eyebrow">Full Stack Software Engineer & Game Developer</p>

              <h1 class="display-3 fw-bold mb-4">Hi, I'm Ethan.</h1>

              <p class="lead mb-5">
                I create small apps, tooling, and games.
              </p>

              <div class="d-flex flex-wrap gap-3">
                <a class="btn btn-light btn-lg rounded-pill px-4" href="#about">About me</a>
                <a class="btn btn-outline-light btn-lg rounded-pill px-4" href="./contact.html">Get in touch</a>
              </div>
            </div>
          </div>
        </div>

        <svg class="hero-wave" viewBox="0 0 1440 120" preserveAspectRatio="none"
            aria-hidden="true">
          <path d="M0,64 C240,120 480,0 720,48 C960,96 1200,112 1440,40 L1440,120 L0,120 Z" />
        </svg>

      </section>

      <section class="about" id="about">
        <div class="container py-lg-5">
          <div class="row align-items-center g-5">
            <div class="col-md-5 col-lg-4" data-reveal>
              <div class="about-photo-wrap">
                <div class="about-photo ratio ratio-1x1">
                  <img class="object-fit-cover" src="#" alt="Picture of me"/>
                </div>
              </div>
            </div>

            <div class="col-md-7 col-lg-8" data-reveal>
              <p class="section-eyebrow">About me</p>
              <h2 class="display-6 fw-bold mb-3">A little about me</h2>
              <p class="text-body-secondary">blah blah blah</p>
              <p class="text-body-secondary mb-4">Even more blah</p>

              <div class="row g-4 mb-4">
                <div class="col-4 about-stat"><strong>10+</strong><span>Years building</span></div>
                <div class="col-4 about-stat"><strong>13</strong><span>Languages</span></div>
              </div>

              <div class="d-flex flex-wrap gap-2">
                <span class="badge rounded-pill skill-badge">TypeScript</span>
                <span class="badge rounded-pill skill-badge">SCSS</span>
                <span class="badge rounded-pill skill-badge">Bootstrap</span>
              </div>
            </div>

          </div>
        </div>
      </section>
    </main>

    <site-footer></site-footer>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/pages/home.ts"></script>
  </body>
</html>
